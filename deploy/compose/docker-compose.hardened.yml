# ArrayDeck — hardened mode. A filtered socket proxy owns the Docker socket;
# ArrayDeck only reaches the read-only endpoints it needs and runs unprivileged
# on an internal network.
services:
  docker-proxy:
    image: ghcr.io/tecnativa/docker-socket-proxy:0.3
    container_name: arraydeck-docker-proxy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      CONTAINERS: "1"   # list/inspect
      EVENTS: "1"
      INFO: "0"
      IMAGES: "0"
      NETWORKS: "1"
      VERSION: "1"
      POST: "0"         # every write method disabled
    labels:
      # Claim it so Unraid's Docker tab stops offering to build a template.
      # No webui label: the proxy has no front end, only ArrayDeck talks to it.
      net.unraid.docker.managed: composeman
    networks:
      - arraydeck-internal
    restart: unless-stopped

  arraydeck:
    # For a locally built image instead: `make docker` and use arraydeck:local.
    image: ghcr.io/gazofnaz/arraydeck:latest
    container_name: arraydeck
    user: "99:100" # Unraid's nobody:users; adjust for your host
    depends_on:
      - docker-proxy
    ports:
      - "31:8417"
    volumes:
      - arraydeck-data:/data
      # - /boot/config/plugins/dockerMan/templates-user:/unraid/templates:ro
    environment:
      DOCKER_HOST: "tcp://docker-proxy:2375"
      # UNRAID_API_URL: "http://tower.local/graphql"
      # UNRAID_API_KEY: "unraid_..."
    labels:
      # Unraid's dockerMan reads these off the running container, so the Docker
      # tab shows a WebUI link and icon with no template to fill in by hand.
      # [PORT:8417] is the *container* port: Unraid substitutes whichever host
      # port it is published on, so re-mapping above needs no change here.
      net.unraid.docker.managed: composeman
      net.unraid.docker.webui: "http://[IP]:[PORT:8417]/"
      net.unraid.docker.icon: "https://raw.githubusercontent.com/gazofnaz/unraid-dashboard/master/docs/icon.png"
    networks:
      - arraydeck-internal
      - default
    restart: unless-stopped

networks:
  arraydeck-internal:
    internal: true

volumes:
  arraydeck-data:
