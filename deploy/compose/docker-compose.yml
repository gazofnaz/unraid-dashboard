# ArrayDeck — compatibility mode (direct Docker socket).
# The socket grants the process broad host power even though ArrayDeck is
# read-only by design; see docker-compose.hardened.yml for the socket-proxy
# deployment.
services:
  arraydeck:
    # For a locally built image instead: `make docker` and use arraydeck:local.
    image: ghcr.io/gazofnaz/arraydeck:latest
    container_name: arraydeck
    ports:
      - "31:8417"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - arraydeck-data:/data
      # On Unraid, mount the dockerMan templates read-only:
      # - /boot/config/plugins/dockerMan/templates-user:/unraid/templates:ro
    environment:
      # Optional Unraid GraphQL API (read-only key; never sent to the browser):
      # UNRAID_API_URL: "http://tower.local/graphql"
      # UNRAID_API_KEY: "unraid_..."
      RECONCILE_INTERVAL_SECONDS: "30"
      LOG_LEVEL: "info"
    labels:
      # Unraid's dockerMan reads these off the running container, so the Docker
      # tab shows a WebUI link and icon with no template to fill in by hand.
      # [PORT:8417] is the *container* port: Unraid substitutes whichever host
      # port it is published on, so re-mapping above needs no change here.
      net.unraid.docker.managed: composeman
      net.unraid.docker.webui: "http://[IP]:[PORT:8417]/"
      net.unraid.docker.icon: "https://raw.githubusercontent.com/gazofnaz/unraid-dashboard/master/docs/icon.png"
    restart: unless-stopped

volumes:
  arraydeck-data:
